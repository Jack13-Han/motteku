name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  build:
    name: build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build

  trip-workflow:
    name: trip workflow and rules
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Test packing quantities, trip validation, and translations
        run: |
          node --experimental-strip-types --test tests/trips.test.mjs tests/packing.test.mjs tests/quantity.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/i18n.test.cjs tests/checklist-api.test.cjs tests/trip-creation.test.cjs
      - name: Test Firestore rules and trip workflow in the local emulator
        run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-motteku --config firebase.packing-test.json "node tests/run-emulator.cjs"
